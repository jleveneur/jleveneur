[mcp_servers.next-devtools]
command = "bunx"
args = ["next-devtools-mcp@latest"]

[mcp_servers.playwright]
command = "bunx"
args = ["@playwright/mcp@latest", "--browser", "chromium"]

[mcp_servers.reui]
url = "https://mcp.reui.io"

[mcp_servers.shadcn]
command = "bunx"
args = ["shadcn@latest", "mcp"]
