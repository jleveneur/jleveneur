[mcp_servers.next-devtools]
command = "pnpm"
args = ["dlx", "next-devtools-mcp@latest"]

[mcp_servers.playwright]
command = "pnpm"
args = ["dlx", "@playwright/mcp@latest", "--browser", "chromium"]

[mcp_servers.reui]
url = "https://mcp.reui.io"

[mcp_servers.shadcn]
command = "pnpm"
args = ["dlx", "shadcn@latest", "mcp"]
