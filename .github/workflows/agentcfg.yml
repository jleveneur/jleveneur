name: agentcfg

# What ci.yml cannot cover for the published CLI: other operating systems, and
# the tarball on the oldest Node it promises. Lint, typecheck and the Linux
# unit tests already run in ci.yml.
on:
  pull_request:
    paths:
      - "packages/agentcfg/**"
      - "bun.lock"
      - ".github/workflows/agentcfg.yml"
  push:
    branches: [main]
    paths:
      - "packages/agentcfg/**"
      - "bun.lock"
      - ".github/workflows/agentcfg.yml"

concurrency:
  group: agentcfg-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # agentcfg's own runtime: the root's `devEngines` names Bun.
          node-version-file: packages/agentcfg/package.json
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/agentcfg test

  package:
    name: Package on Node 22
    # The published package promises Node 22.13. Pack it with Bun, the
    # workspace's toolchain, then install the tarball the way a user would and
    # run it on the oldest Node.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The tarball the release publishes, packed the same way (`prepack`
      # builds `dist/`).
      - run: bun pm pack --destination "$RUNNER_TEMP"
        working-directory: packages/agentcfg

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0

      - name: Install and run the tarball
        working-directory: ${{ runner.temp }}
        run: |
          node --version
          npm install --global ./jleveneur-agentcfg-*.tgz
          agentcfg --version
          agentcfg --help
          agentcfg scan
