name: Images

# Builds the portfolio's production image, so the server never builds
# anything itself. The Deploy workflow calls it for the release it is about to
# deploy, so the image is built when something goes to production, not on
# every merge. A commit whose image is already in GHCR (a rollback, a
# redeploy) is not built again unless the deploy asks for a rebuild. A pull
# request that touches how the image is built builds it without pushing, to
# catch a broken Dockerfile before it merges.
on:
  workflow_call:
    inputs:
      sha:
        description: Full commit SHA to build
        required: true
        type: string
      rebuild:
        description: Build even when the commit's image is already in GHCR
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - apps/portfolio/Dockerfile
      - apps/portfolio/Dockerfile.dockerignore
      - apps/portfolio/next.config.ts
      - .github/workflows/images.yml

# A newer push to a pull request cancels its build. A deploy is never
# cancelled halfway, and runs one at a time on its own.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build the portfolio image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    env:
      SOURCE_SHA: ${{ inputs.sha || github.event.pull_request.head.sha }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/jleveneur-portfolio
      PUBLISH: ${{ github.event_name != 'pull_request' }}

    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images stay in GHCR, so a commit deployed before is not built again.
      - name: Look for the commit's image
        id: existing
        if: env.PUBLISH == 'true' && !inputs.rebuild
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${SOURCE_SHA}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${SOURCE_SHA} is already in GHCR"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.existing.outputs.found != 'true'
        with:
          ref: ${{ env.SOURCE_SHA }}

      # The image is tagged with the commit it was built from, which is what a
      # deploy pins and a rollback returns to.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.existing.outputs.found != 'true'
        with:
          context: .
          file: apps/portfolio/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ env.SOURCE_SHA }}
          # Links the package to this repository, so it inherits its access.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,mode=max,scope=portfolio

      # `latest` moves to the commit being deployed, rollbacks included: it is
      # what the compose file runs on the server when release.env is missing.
      - name: Point latest at the commit
        if: env.PUBLISH == 'true'
        run: docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${SOURCE_SHA}"
