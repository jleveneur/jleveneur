name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

# Production deploys should finish, not be cancelled by a later push.
concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      # Cloudflare's GitHub Actions guide uses these two names. The values
      # never belong in the repo. An empty secret is an empty string here.
      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Add repository secret CLOUDFLARE_API_TOKEN (Cloudflare dashboard → API tokens → Edit Cloudflare Workers)."
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Add repository secret CLOUDFLARE_ACCOUNT_ID (from dash.cloudflare.com/<account_id>)."
            missing=1
          fi
          exit "${missing}"

      # vinext-cloudflare builds with Vite, then wrangler-deploys apps/portfolio
      # only. apps/web stays the starter example and is not published.
      - name: Deploy apps/portfolio
        working-directory: apps/portfolio
        run: pnpm run deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
