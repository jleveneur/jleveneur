name: Deploy

# Puts `apps/portfolio` on jleveneur.com and runs the services beside it
# (Uptime Kuma, Beszel, Umami) on the VPS. It runs once the Images workflow has
# published the portfolio's image for `main` (which it only does after CI has
# passed), and by hand with a commit SHA to roll back (or forward) to that
# commit, whose image stays in GHCR.
#
# The portfolio is a standalone Next.js server in a container, the Compose
# project in /srv/jleveneur. Each service is a Compose project in
# /srv/<service>. Their secrets are in a `.env` there that never leaves the
# server. Over SSH as `deploy`, the one deploy account of the VPS
# (deploy/vps/deploy-user.sh): it owns the projects' directories in /srv and
# their files in /etc/caddy/sites, is in the docker group, and may only
# `sudo systemctl reload caddy` (and start the Hydromag backup). The job pulls
# the commit's portfolio image with this run's GITHUB_TOKEN (so no long-lived
# registry credential lives on the server), starts it and each service from
# the commit's compose files, installs the commit's Caddy sites, and checks
# the public URLs. A new service is set up once by hand: its /srv directory
# and `.env`, and its sites file in /etc/caddy/sites, owned by `deploy`; then
# it joins SERVICES.
#
# Configuration: the `production` environment holds DEPLOY_SSH_KEY (the deploy
# account's private key, the same in jleveneur/hydromag; the docker group makes
# it root-equivalent on the server) and DEPLOY_KNOWN_HOSTS (the server's pinned
# host key); repository variables give DEPLOY_HOST, optionally DEPLOY_USER, and
# DEPLOY_ENABLED=true once the server is set up. deploy/vps/github-secrets.sh
# sets them in both repositories.
on:
  workflow_run:
    workflows: [Images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy (defaults to the selected ref)
        required: false

# Deploys run one after the other, never in parallel, and none is cancelled
# halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to the VPS
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://jleveneur.com
    permissions:
      contents: read
      packages: read

    env:
      SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      # Each has deploy/<service>/compose.yml and deploy/caddy/<service>.caddy.
      SERVICES: uptime-kuma beszel umami

    steps:
      - name: Check the SHA
        run: |
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::'$SHA' is not a full commit SHA"
            exit 1
          fi

      # The compose files and the Caddy sites come from the commit being
      # deployed, so a rollback rolls all of them back with the image.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}

      # The host key is pinned (DEPLOY_KNOWN_HOSTS, from `ssh-keyscan`), so a
      # server that is not ours is refused rather than trusted on first use.
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # `release.env` records the deployed commit, so a manual
      # `docker compose --env-file .env --env-file release.env up -d` on the
      # server starts the same image. `--wait` fails the job if the container
      # does not come up healthy; the previous one keeps serving until the new
      # one has started.
      - name: Pull and start the portfolio
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          scp -q deploy/portfolio/compose.yml production:/srv/jleveneur/compose.yml
          ssh production 'bash -s' <<EOF
          set -euo pipefail
          cd /srv/jleveneur
          echo '$REGISTRY_TOKEN' | docker login ghcr.io -u '$REGISTRY_USER' --password-stdin > /dev/null
          trap 'docker logout ghcr.io > /dev/null' EXIT
          printf 'PORTFOLIO_TAG=%s\n' '$SHA' > release.env
          docker compose --env-file .env --env-file release.env pull --quiet
          docker compose --env-file .env --env-file release.env up -d --remove-orphans --wait --wait-timeout 180
          docker compose --env-file .env --env-file release.env ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}'
          EOF

      # Images are version-pinned, so `--pull missing` downloads only what a
      # new tag needs and `up -d` recreates only the containers whose
      # definition changed: a commit that leaves a service alone leaves it
      # running. `--wait` fails the job if a service does not come up healthy.
      - name: Start the services
        run: |
          for service in $SERVICES; do
            scp -q "deploy/$service/compose.yml" "production:/srv/$service/compose.yml"
          done
          ssh production "SERVICES='$SERVICES' bash -s" <<'EOF'
          set -euo pipefail
          for service in $SERVICES; do
            echo "== $service"
            cd "/srv/$service"
            docker compose up -d --pull missing --remove-orphans --wait --wait-timeout 180
            docker compose ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}'
          done
          EOF

      # The nightly backup of Umami, Uptime Kuma and Beszel runs this script
      # (deploy/backup/backup.sh) from jleveneur-backup.service; its unit and
      # timer are installed once by deploy/vps/install-backups.sh. The R2 key
      # it reads, /srv/backup/r2.env, never leaves the server.
      - name: Update the backup script
        run: |
          scp -q deploy/backup/backup.sh production:/srv/backup/jleveneur-backup.sh.new
          ssh production 'chmod 755 /srv/backup/jleveneur-backup.sh.new && mv /srv/backup/jleveneur-backup.sh.new /srv/backup/jleveneur-backup.sh'

      # The previous sites files are kept until Caddy has accepted the new
      # ones. `systemctl reload` refuses an invalid configuration and keeps the
      # running one; the old files then go back, so a restart of Caddy would
      # not trip over a broken one. The copies live in /srv/jleveneur, since
      # `deploy` owns its files in /etc/caddy/sites but not the directory.
      - name: Update the Caddy sites
        run: |
          ssh production 'install -d -m 750 /srv/jleveneur/caddy/new /srv/jleveneur/caddy/previous'
          scp -q deploy/caddy/jleveneur.caddy production:/srv/jleveneur/caddy/new/
          for service in $SERVICES; do
            scp -q "deploy/caddy/$service.caddy" production:/srv/jleveneur/caddy/new/
          done
          ssh production 'bash -s' <<'EOF'
          set -euo pipefail
          cd /srv/jleveneur/caddy
          rm -f previous/*.caddy
          for file in new/*.caddy; do
            name="$(basename "$file")"
            cp "/etc/caddy/sites/$name" "previous/$name"
            cat "$file" > "/etc/caddy/sites/$name"
          done
          rm -f new/*.caddy
          if ! sudo systemctl reload caddy; then
            for file in previous/*.caddy; do
              cat "$file" > "/etc/caddy/sites/$(basename "$file")"
            done
            echo "Caddy refused the new sites files; the previous ones are back." >&2
            exit 1
          fi
          EOF

      - name: Check the public URLs
        run: |
          check() {
            local url="$1" expected="$2" code=""
            for _ in $(seq 1 12); do
              code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$url" || true)"
              if [ "$code" = "$expected" ]; then
                echo "$url -> $code"
                return 0
              fi
              sleep 5
            done
            echo "::error::$url answered $code, expected $expected"
            return 1
          }
          check https://jleveneur.com/ 200
          check https://jleveneur.com/en 200
          check https://jleveneur.com/contact 200
          check https://www.jleveneur.com/ 301
          check https://status.jleveneur.com/api/entry-page 200
          check https://monitor.jleveneur.com/api/health 200
          check https://stats.jleveneur.com/api/heartbeat 200
          check https://stats.hydromag.fr/api/heartbeat 200

      # Images no container uses and older than two weeks go. Recent ones stay
      # on the server, so rolling back a few commits needs no download.
      - name: Prune old images
        run: ssh production 'docker image prune --all --force --filter "until=336h" > /dev/null'
