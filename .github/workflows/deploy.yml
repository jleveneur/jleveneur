name: Deploy

# Puts `apps/portfolio` on jleveneur.com and runs the services beside it
# (Uptime Kuma, Beszel, Umami) on the VPS. Merging to `main` deploys nothing:
# the Release workflow keeps a release pull request open, and merging it
# publishes a GitHub release `site@v<version>`, which runs this workflow. Run
# it by hand to redeploy (after changing a value), or to roll back (or
# forward) to another release or any commit of `main`:
#
#   gh workflow run deploy.yml                       # the latest release
#   gh workflow run deploy.yml -f ref=site@v1.2.0    # a release, or a full SHA
#
# The commit must be on `main` and have passed CI there. The Images workflow
# then builds the portfolio's image and pushes it to GHCR, unless it is
# already there from an earlier deploy; `rebuild` builds it again.
#
# The portfolio is a standalone Next.js server in a container, the Compose
# project in /srv/jleveneur. Each service is a Compose project in
# /srv/<service>. Their `.env` files, and the backups' in /srv/backup, are
# written by each deploy from the `production` environment. Over SSH as
# `deploy`, the one deploy account of the VPS
# (deploy/vps/deploy-user.sh): it owns the projects' directories in /srv and
# their files in /etc/caddy/sites, is in the docker group, and may only
# `sudo systemctl reload caddy` (and start the Hydromag backup). The job pulls
# the commit's portfolio image with this run's GITHUB_TOKEN (so no long-lived
# registry credential lives on the server), starts it and each service from
# the commit's compose files, installs the commit's Caddy sites, and checks
# the public URLs. A new service is set up once by hand: its /srv directory
# and its sites file in /etc/caddy/sites, owned by `deploy`; then it joins
# SERVICES, and its variables join the "Write the production variables" step.
#
# Configuration: the `production` environment holds DEPLOY_SSH_KEY (the deploy
# account's private key, the same in jleveneur/hydromag; the docker group makes
# it root-equivalent on the server) and DEPLOY_KNOWN_HOSTS (the server's pinned
# host key), which deploy/vps/github-secrets.sh sets in both repositories, and
# the services' own values, prefixed by service, which
# deploy/vps/github-env.sh sets from a local file. Repository variables give
# DEPLOY_HOST, optionally DEPLOY_USER, and DEPLOY_ENABLED=true once the server
# is set up.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag or full commit SHA to deploy (defaults to the latest site release)
        required: false
      rebuild:
        description: Build the image again even if GHCR already has it
        type: boolean
        default: false

# Deploys run one after the other, never in parallel, and none is cancelled
# halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  commit:
    name: Check the commit
    # Site releases are `site@v<version>`, as release-please-config.json sets;
    # agentcfg's releases (`agentcfg@v<version>`) are not deployed.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'site@v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      ref: ${{ steps.check.outputs.ref }}
      sha: ${{ steps.check.outputs.sha }}
    env:
      REF: ${{ inputs.ref || github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      # Only what `main` holds goes to production, and only once the CI
      # workflow's `CI` job, which requires every other, has passed on that
      # very commit.
      - name: Check the commit
        id: check
        run: |
          if [ -z "$REF" ]; then
            REF="$(gh api "repos/$GH_REPO/releases" --jq '[.[] | select(.draft | not) | select(.tag_name | startswith("site@v"))][0].tag_name // empty')"
            if [ -z "$REF" ]; then
              echo "::error::There is no site release to deploy"
              exit 1
            fi
          fi
          # It ends up in release.env on the server, so it stays plain.
          if ! printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9._@/-]+$'; then
            echo "::error::'$REF' is not a tag or a commit SHA"
            exit 1
          fi
          if ! sha="$(gh api "repos/$GH_REPO/commits/${REF//@/%40}" --jq .sha)"; then
            echo "::error::'$REF' is neither a tag nor a commit of this repository"
            exit 1
          fi
          status="$(gh api "repos/$GH_REPO/compare/$sha...main" --jq .status)"
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "::error::$REF ($sha) is not on main"
            exit 1
          fi
          ci="$(gh api "repos/$GH_REPO/commits/$sha/check-runs?check_name=CI&filter=latest" --jq '.check_runs[0].conclusion // "missing"')"
          if [ "$ci" != success ]; then
            echo "::error::CI on $REF ($sha) is $ci, not success"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying \`$REF\` ($sha)" >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Images
    needs: commit
    uses: ./.github/workflows/images.yml
    with:
      sha: ${{ needs.commit.outputs.sha }}
      rebuild: ${{ inputs.rebuild || false }}
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy to the VPS
    needs: [commit, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://jleveneur.com
    permissions:
      contents: read
      packages: read

    env:
      SHA: ${{ needs.commit.outputs.sha }}
      RELEASE: ${{ needs.commit.outputs.ref }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      # Each has deploy/<service>/compose.yml and deploy/caddy/<service>.caddy.
      SERVICES: uptime-kuma beszel umami

    steps:
      # The compose files and the Caddy sites come from the commit being
      # deployed, so a rollback rolls all of them back with the image.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}

      # The host key is pinned (DEPLOY_KNOWN_HOSTS, from `ssh-keyscan`), so a
      # server that is not ours is refused rather than trusted on first use.
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # Each file is written whole from the `production` environment, mode
      # 600, and the one it replaces stays beside it as `<file>.previous`;
      # an edit made on the server is overwritten. Every file is built before
      # any is sent, so a missing required value stops the job with nothing
      # written. A value is single-quoted when it holds anything beyond plain
      # URL characters (Beszel's key holds a space), so neither Compose nor
      # systemd reads into it; one with a single quote or a line break is
      # refused.
      #
      # UMAMI_POSTGRES_PASSWORD is the password Umami's database volume was
      # created with. Changing the secret does not change it in Postgres:
      # change it in the database first (ALTER ROLE), then here.
      - name: Write the production variables
        env:
          PORTFOLIO_RESEND_API_KEY: ${{ secrets.PORTFOLIO_RESEND_API_KEY }}
          PORTFOLIO_EMAIL_FROM: ${{ vars.PORTFOLIO_EMAIL_FROM }}
          PORTFOLIO_CONTACT_TO: ${{ vars.PORTFOLIO_CONTACT_TO }}
          PORTFOLIO_LOG_LEVEL: ${{ vars.PORTFOLIO_LOG_LEVEL }}
          UMAMI_POSTGRES_PASSWORD: ${{ secrets.UMAMI_POSTGRES_PASSWORD }}
          UMAMI_APP_SECRET: ${{ secrets.UMAMI_APP_SECRET }}
          UMAMI_TWO_FACTOR_ENCRYPTION_KEY: ${{ secrets.UMAMI_TWO_FACTOR_ENCRYPTION_KEY }}
          BESZEL_AGENT_KEY: ${{ vars.BESZEL_AGENT_KEY }}
          BESZEL_AGENT_TOKEN: ${{ secrets.BESZEL_AGENT_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          BACKUP_HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
        run: |
          files=()
          # build <server file> <KEY=GITHUB_NAME>…: a trailing ! marks a
          # required value.
          build() {
            local target="$1" pair key name required value file
            shift
            file="$(mktemp -p "$RUNNER_TEMP")"
            printf '# Written by the Deploy workflow of jleveneur/jleveneur from its production\n# environment: change it there (deploy/vps/github-env.sh), not here.\n' > "$file"
            for pair in "$@"; do
              key="${pair%%=*}"
              name="${pair#*=}"
              required=false
              if [[ "$name" == *! ]]; then
                name="${name%!}"
                required=true
              fi
              value="${!name}"
              if [ -z "$value" ]; then
                if [ "$required" = true ]; then
                  echo "::error::$name is not set in the production environment"
                  exit 1
                fi
                continue
              fi
              if [[ "$value" == *"'"* || "$value" == *$'\n'* ]]; then
                echo "::error::$name holds a single quote or a line break"
                exit 1
              fi
              if [[ "$value" =~ ^[A-Za-z0-9._:/@+=,%?\&~-]+$ ]]; then
                printf '%s=%s\n' "$key" "$value" >> "$file"
              else
                printf "%s='%s'\n" "$key" "$value" >> "$file"
              fi
            done
            files+=("$target=$file")
          }
          umask 077
          build /srv/jleveneur/.env RESEND_API_KEY=PORTFOLIO_RESEND_API_KEY! EMAIL_FROM=PORTFOLIO_EMAIL_FROM! \
            CONTACT_TO=PORTFOLIO_CONTACT_TO LOG_LEVEL=PORTFOLIO_LOG_LEVEL
          build /srv/umami/.env POSTGRES_PASSWORD=UMAMI_POSTGRES_PASSWORD! APP_SECRET=UMAMI_APP_SECRET! \
            TWO_FACTOR_ENCRYPTION_KEY=UMAMI_TWO_FACTOR_ENCRYPTION_KEY!
          build /srv/beszel/.env BESZEL_AGENT_KEY=BESZEL_AGENT_KEY! BESZEL_AGENT_TOKEN=BESZEL_AGENT_TOKEN!
          build /srv/backup/r2.env R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID! R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY! \
            R2_ENDPOINT=R2_ENDPOINT! R2_BUCKET=R2_BUCKET!
          build /srv/backup/backup.env HEARTBEAT_URL=BACKUP_HEARTBEAT_URL
          for entry in "${files[@]}"; do
            target="${entry%%=*}"
            file="${entry#*=}"
            # The target expands here, on the runner: it is one of the paths above.
            # shellcheck disable=SC2029
            ssh production "set -e; umask 077; cat > '$target.new'; if [ -f '$target' ]; then cp -p '$target' '$target.previous'; fi; mv '$target.new' '$target'" < "$file"
            rm -f "$file"
            echo "$target written"
          done

      # `release.env` records the deployed commit and release, so a manual
      # `docker compose --env-file .env --env-file release.env up -d` on the
      # server starts the same image. `--wait` fails the job if the container
      # does not come up healthy; the previous one keeps serving until the new
      # one has started.
      - name: Pull and start the portfolio
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          scp -q deploy/portfolio/compose.yml production:/srv/jleveneur/compose.yml
          ssh production 'bash -s' <<EOF
          set -euo pipefail
          cd /srv/jleveneur
          echo '$REGISTRY_TOKEN' | docker login ghcr.io -u '$REGISTRY_USER' --password-stdin > /dev/null
          trap 'docker logout ghcr.io > /dev/null' EXIT
          printf 'PORTFOLIO_TAG=%s\nPORTFOLIO_RELEASE=%s\n' '$SHA' '$RELEASE' > release.env
          docker compose --env-file .env --env-file release.env pull --quiet
          docker compose --env-file .env --env-file release.env up -d --remove-orphans --wait --wait-timeout 180
          docker compose --env-file .env --env-file release.env ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}'
          EOF

      # Images are version-pinned, so `--pull missing` downloads only what a
      # new tag needs and `up -d` recreates only the containers whose
      # definition changed: a commit that leaves a service alone leaves it
      # running. `--wait` fails the job if a service does not come up healthy.
      - name: Start the services
        run: |
          for service in $SERVICES; do
            scp -q "deploy/$service/compose.yml" "production:/srv/$service/compose.yml"
          done
          ssh production "SERVICES='$SERVICES' bash -s" <<'EOF'
          set -euo pipefail
          for service in $SERVICES; do
            echo "== $service"
            cd "/srv/$service"
            docker compose up -d --pull missing --remove-orphans --wait --wait-timeout 180
            docker compose ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}'
          done
          EOF

      # The nightly backup of Umami, Uptime Kuma and Beszel runs this script
      # (deploy/backup/backup.sh) from jleveneur-backup.service; its unit and
      # timer are installed once by deploy/vps/install-backups.sh. The R2 key
      # it reads, /srv/backup/r2.env, is written above.
      - name: Update the backup script
        run: |
          scp -q deploy/backup/backup.sh production:/srv/backup/jleveneur-backup.sh.new
          ssh production 'chmod 755 /srv/backup/jleveneur-backup.sh.new && mv /srv/backup/jleveneur-backup.sh.new /srv/backup/jleveneur-backup.sh'

      # The previous sites files are kept until Caddy has accepted the new
      # ones. `systemctl reload` refuses an invalid configuration and keeps the
      # running one; the old files then go back, so a restart of Caddy would
      # not trip over a broken one. The copies live in /srv/jleveneur, since
      # `deploy` owns its files in /etc/caddy/sites but not the directory.
      - name: Update the Caddy sites
        run: |
          ssh production 'install -d -m 750 /srv/jleveneur/caddy/new /srv/jleveneur/caddy/previous'
          scp -q deploy/caddy/jleveneur.caddy production:/srv/jleveneur/caddy/new/
          for service in $SERVICES; do
            scp -q "deploy/caddy/$service.caddy" production:/srv/jleveneur/caddy/new/
          done
          ssh production 'bash -s' <<'EOF'
          set -euo pipefail
          cd /srv/jleveneur/caddy
          rm -f previous/*.caddy
          for file in new/*.caddy; do
            name="$(basename "$file")"
            cp "/etc/caddy/sites/$name" "previous/$name"
            cat "$file" > "/etc/caddy/sites/$name"
          done
          rm -f new/*.caddy
          if ! sudo systemctl reload caddy; then
            for file in previous/*.caddy; do
              cat "$file" > "/etc/caddy/sites/$(basename "$file")"
            done
            echo "Caddy refused the new sites files; the previous ones are back." >&2
            exit 1
          fi
          EOF

      - name: Check the public URLs
        run: |
          check() {
            local url="$1" expected="$2" code=""
            for _ in $(seq 1 12); do
              code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$url" || true)"
              if [ "$code" = "$expected" ]; then
                echo "$url -> $code"
                return 0
              fi
              sleep 5
            done
            echo "::error::$url answered $code, expected $expected"
            return 1
          }
          check https://jleveneur.com/ 200
          check https://jleveneur.com/en 200
          check https://jleveneur.com/contact 200
          check https://www.jleveneur.com/ 301
          check https://status.jleveneur.com/api/entry-page 200
          check https://monitor.jleveneur.com/api/health 200
          check https://stats.jleveneur.com/api/heartbeat 200
          check https://stats.hydromag.fr/api/heartbeat 200

      # Images no container uses and older than two weeks go. Recent ones stay
      # on the server, so rolling back a few commits needs no download.
      - name: Prune old images
        run: ssh production 'docker image prune --all --force --filter "until=336h" > /dev/null'
