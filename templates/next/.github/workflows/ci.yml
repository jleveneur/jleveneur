name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push makes the previous run's answer irrelevant. `main` is exempt so the
# post-merge record stays complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `id-token` for the Remote Cache's OIDC exchange.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bun (from `packageManager`) installs the packages, runs the tests
      # (`bun test`), the type checks (`bun check`), and Knip (`knip-bun`). No
      # Node is set up: Next and the other CLIs written for Node run on the
      # one the runner ships.
      #
      # `--frozen-lockfile` because an out-of-date lockfile has to fail CI
      # rather than be silently resolved.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Vercel Remote Cache, shared by CI and the team: a task whose inputs and
      # declared variables have not changed is replayed instead of run. The
      # action trades this job's GitHub OIDC token for a short-lived Turborepo
      # token (a Turborepo CLI policy on the Vercel team names this repository),
      # so no secret is stored. Off until the `TURBO_TEAM` variable is set.
      - name: Set up the Turborepo Remote Cache
        if: vars.TURBO_TEAM != ''
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run knip
      - run: bun run react-doctor
      - run: bun run test

      # The PR title becomes the squashed commit message, so it is the thing
      # that has to satisfy commitlint. The commit-msg hook covers local commits.
      # Through `env`: a title interpolated into the script would run as shell.
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" | bunx commitlint

      # `next build` evaluates route modules, which validate the environment.
      # No secret is baked into the output — nothing is NEXT_PUBLIC_ — so
      # placeholders are enough to prove the app compiles.
      - run: bun run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The one suite that needs a real database: Better Auth writing through the
    # Drizzle adapter, and permissions read back from the rows it wrote.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app
      BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run test:integration

  e2e:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `id-token` for the Remote Cache's OIDC exchange.
    permissions:
      contents: read
      id-token: write

    # The journeys that only exist in a browser: verification, password reset,
    # and invitation links, each followed the way a person would.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app
      BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3111
      # No key on purpose: mail goes to the outbox the tests read.
      RESEND_API_KEY: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Vercel Remote Cache, shared by CI and the team: a task whose inputs and
      # declared variables have not changed is replayed instead of run. The
      # action trades this job's GitHub OIDC token for a short-lived Turborepo
      # token (a Turborepo CLI policy on the Vercel team names this repository),
      # so no secret is stored. Off until the `TURBO_TEAM` variable is set.
      - name: Set up the Turborepo Remote Cache
        if: vars.TURBO_TEAM != ''
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      # When every suite's pass is already cached, `test:e2e` replays it and
      # starts no browser and no server, so the database and Chromium are not
      # needed. The dry run asks the same question with the same environment;
      # it also lists packages with no `test:e2e` script, always a miss.
      - name: Check whether the browser tests replay from the cache
        id: e2e
        run: |
          status="$(bunx turbo run test:e2e --dry=json 2>/dev/null | jq -r '[.tasks[] | select(.task == "test:e2e" and .command != "<NONEXISTENT>") | .cache.status] | unique | join(",")')"
          echo "test:e2e cache: ${status:-unknown}"
          echo "replay=$([ "$status" = HIT ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.e2e.outputs.replay != 'true'
        run: bun run db:migrate

      # Chromium comes from GitHub's cache, keyed on the Playwright version the
      # apps pin (one install serves them all), so a run only downloads it from
      # Playwright's CDN when that version changes. Its system libraries are
      # already on GitHub's runners, which ship Google Chrome: `install-deps`
      # would only add fonts and xvfb through apt, whose mirror stalls jobs.
      - name: Read the Playwright version
        if: steps.e2e.outputs.replay != 'true'
        id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' apps/web/package.json)" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        if: steps.e2e.outputs.replay != 'true'
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.e2e.outputs.replay != 'true' && steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 5
        working-directory: apps/web
        run: bunx playwright install chromium
      - run: bun run test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # The ruleset on `main` requires a check named `CI`. GitHub matches the job
  # `name`, not the workflow file name, so Check / Integration / Browser being
  # green is not enough — without this job the required check never reports,
  # and platform automerge waits forever.
  #
  # `always()` is load-bearing: if a needed job fails, a dependent job is
  # skipped by default, and a skipped required check is the same stuck state
  # as a missing one. Run anyway, then fail unless every sibling succeeded.
  ci:
    name: CI
    if: always()
    needs: [check, integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job
        run: |
          test "${{ needs.check.result }}" = success
          test "${{ needs.integration.result }}" = success
          test "${{ needs.e2e.result }}" = success
